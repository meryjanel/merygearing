version: "3.7"

services:
  postgres.meryats-services:
    image: postgres:14
    restart: always
    environment:      
      POSTGRES_DB: meryats
      POSTGRES_USER: root #production에선 변경해서 사용
      POSTGRES_PASSWORD: fKQw9NBy7VKiptGO #production에선 변경해서 사용
    volumes:
      - postgresql.meryats:/var/lib/postgresql/data
    ports:
      - 5448:5432 # temporary
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

volumes:
  postgresql.meryats:
